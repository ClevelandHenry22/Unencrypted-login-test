<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureTech Login</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
        font-family: Arial, Helvetica, sans-serif;
    }

    .login-box {
        width: 350px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        text-align: center;
        color: white;
    }

    .login-box h2 {
        margin-bottom: 25px;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
    }

    .login-box input[type="submit"] {
        width: 95%;
        padding: 12px;
        margin-top: 20px;
        background: #00b7ff;
        border: none;
        border-radius: 8px;
        color: black;
        font-size: 17px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .login-box input[type="submit"]:hover {
        background: #009ad6;
    }

    .disclaimer {
        font-size: 12px;
        color: #ccc;
        margin-top: 10px;
    }

</style>
</head>

<body>

<div class="login-box">
    <h2>Member Login</h2>
    <form action="login.php" method="POST">
        <input type="text" name="user" placeholder="Enter Username" required autocomplete="off">
        <input type="password" name="pass" placeholder="Enter Password" required autocomplete="off">
        <input type="submit" value="Login">
    </form>
    <p class="disclaimer">
        This login system is intentionally insecure for cybersecurity practice.
    </p>
</div>

</body>
</html>
